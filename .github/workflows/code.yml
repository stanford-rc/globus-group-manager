# vim: ts=2 sw=2 et

# On every push, and on every PR, do come checks.
#
# We do the following things:
# * Run CodeQL

name: Run CodeQL 

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codeql:
    name: Run CodeQL on ubuntu-latest & Python 3.13
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
    - name: Install non-Python dependencies (Ubuntu)
      run: |
        true

    - name: Check out code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install dependencies for testing
      run: |
        pip install .

    - name: CodeQL Init
      uses: github/codeql-action/init@3599b3baa15b485a2e49ef411a7a4bb2452e7f93
      with:
        languages: python

    - name: CodeQL Analyze
      uses: github/codeql-action/analyze@3599b3baa15b485a2e49ef411a7a4bb2452e7f93
      with:
        category: "/language:python"
